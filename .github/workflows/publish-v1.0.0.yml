name: Publish v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate, tag, and publish the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0
          RELEASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_SHA"
          python scripts/check-docs.py
          python scripts/check-version.py --tag "$RELEASE_TAG"
          ./scripts/check.sh

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi

          git config user.name "Jeff Li"
          git config user.email "laojianzi1994@gmail.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Omarchy Hosts $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

          python scripts/release-notes.py --tag "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Omarchy Hosts $RELEASE_TAG" \
            --notes-file release-notes.md \
            --latest
