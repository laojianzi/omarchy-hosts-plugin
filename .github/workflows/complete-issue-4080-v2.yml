name: Complete final Issue 4080 remediation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/complete-issue-4080-v2.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revalidate, merge, clean, tag, and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: security/issue-4080-hardening-final-v2
          RELEASE_TAG: v1.0.1
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            if git fetch origin main "$TARGET_BRANCH" --tags 2>/dev/null; then
              break
            fi
            sleep 4
          done
          git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH" || {
            echo "The fully validated product branch was not produced" >&2
            exit 1
          }

          git checkout --detach "origin/$TARGET_BRANCH"
          test "$(python - <<'PY'
          import json
          print(json.load(open('manifest.json', encoding='utf-8'))['version'])
          PY
          )" = '1.0.1'
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'ci.yml release.yml '
          test ! -e scripts/build_issue_4080_clean.py
          test ! -e scripts/post_issue_4080_clean.py
          test ! -e scripts/post_issue_4080_clean_v2.py
          if find scripts -maxdepth 1 -type f \( -name '*transform*' -o -name '*hardening*' -o -name '*issue-4080*' \) | grep -q .; then
            echo 'Experimental code is present in the product branch' >&2
            exit 1
          fi

          grep -q 'src_dir_fd=directory_fd' src/omarchy_hosts/store.py
          grep -q 'dst_dir_fd=directory_fd' src/omarchy_hosts/store.py
          grep -q 'read_regular_file_at' src/omarchy_hosts/cli.py
          grep -q '_stage_candidate_bytes' src/omarchy_hosts/cli.py
          grep -q 'run_bounded_process' src/omarchy_hosts/cli.py
          grep -q 'start_new_session=True' src/omarchy_hosts/process_control.py
          grep -q '_signal_group(process, signal.SIGKILL)' src/omarchy_hosts/process_control.py
          grep -q 'sha256_bytes(encoded)' system/helper.py
          grep -q 'setitimer' system/helper.py
          grep -q 'SplitParser' Service.qml
          grep -q 'Component.onDestruction' Service.qml
          ! grep -q 'StdioCollector' Service.qml
          ! grep -q 'subprocess.run' src/omarchy_hosts/cli.py
          ! grep -q 'ROOT_STATE_PATH.read_text' src/omarchy_hosts/cli.py

          python scripts/check-docs.py
          python scripts/check-version.py
          PYTHONDEVMODE=1 PYTHONWARNINGS=error ./scripts/check.sh
          git diff --check

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$TARGET_BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --head "$TARGET_BRANCH" \
                --base main \
                --title 'security: harden filesystem and process boundaries' \
                --body $'## Summary\n\nRemediates the blocking findings from omacom/omarchy-plugin-marketplace#4080.\n\n- descriptor-relative state and candidate I/O\n- one bounded no-follow root-state descriptor read\n- digest-bound privileged candidates and component-by-component path traversal\n- bounded process output, hard deadlines, process-group teardown and QML destruction cleanup\n- root-helper watchdog and regression tests\n- patch release metadata for 1.0.1\n\nThe separate root helper and Marketplace `manual-setup` disclosure remain intentional.'
            )"
            pr_number="${pr_url##*/}"
          fi
          [[ "$pr_number" =~ ^[0-9]+$ ]]

          git checkout -B main origin/main
          git config user.name 'Jeff Li'
          git config user.email 'laojianzi1994@gmail.com'
          git merge --no-ff "origin/$TARGET_BRANCH" \
            -m 'security: harden filesystem and process boundaries (#'"$pr_number"')'

          python scripts/check-docs.py
          python scripts/check-version.py
          PYTHONDEVMODE=1 PYTHONWARNINGS=error ./scripts/check.sh
          git diff --check

          # Release source must contain only permanent workflows.
          rm -f \
            .github/workflows/complete-issue-4080.yml \
            .github/workflows/complete-issue-4080-v2.yml \
            .github/workflows/publish-v1.0.1.yml \
            .github/workflows/cleanup-v1.0.1-publisher.yml
          git add -A
          git commit -m 'chore: finalize v1.0.1 release tree'

          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'ci.yml release.yml '
          python scripts/check-docs.py
          python scripts/check-version.py --tag "$RELEASE_TAG"
          PYTHONDEVMODE=1 PYTHONWARNINGS=error ./scripts/check.sh
          git diff --check

          release_sha="$(git rev-parse HEAD)"
          existing_tag_sha="$(
            git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" \
              | awk '{print $1}'
          )"
          if [[ -z "$existing_tag_sha" ]]; then
            lightweight_sha="$(
              git ls-remote --tags origin "refs/tags/$RELEASE_TAG" \
                | awk '{print $1}'
            )"
            if [[ -n "$lightweight_sha" ]]; then
              existing_tag_sha="$lightweight_sha"
            fi
          fi
          if [[ -n "$existing_tag_sha" && "$existing_tag_sha" != "$release_sha" ]]; then
            echo "$RELEASE_TAG already exists at a different commit" >&2
            exit 1
          fi

          git push origin HEAD:main
          if [[ -z "$existing_tag_sha" ]]; then
            git tag -a "$RELEASE_TAG" "$release_sha" -m "Omarchy Hosts $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          for attempt in $(seq 1 36); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            python scripts/release-notes.py --tag "$RELEASE_TAG" > /tmp/release-notes.md
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Omarchy Hosts $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

          git push origin --delete "$TARGET_BRANCH" || true
          echo "merged_pr=$pr_number"
          echo "release_sha=$release_sha"
