name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bilingual documentation
        run: python scripts/check-docs.py

      - name: Validate tag and source versions
        run: python scripts/check-version.py --tag "$GITHUB_REF_NAME"

      - name: Run repository checks
        run: ./scripts/check.sh

      - name: Generate canonical release notes
        run: python scripts/release-notes.py --tag "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Omarchy Hosts $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest
