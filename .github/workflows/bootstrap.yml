name: Bootstrap repository

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact project tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-* | base64 --decode > /tmp/project.tar.gz
          actual_sha="$(sha256sum /tmp/project.tar.gz | awk '{print $1}')"
          test "$actual_sha" = "6322665017c3642c74efd54aa74c65acea46ee10daf5480b066d873f9c428f23"
          tar -xzf /tmp/project.tar.gz
          rm -rf bootstrap .github/workflows/bootstrap.yml
          git config user.name "Jeff Li"
          git config user.email "laojianzi1994@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: publish complete Omarchy Hosts plugin"
          git push origin HEAD:main
